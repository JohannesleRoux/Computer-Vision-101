[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cv101"
version = "0.1.0"
description = "Computer Vision 101 — shared utility package for course notebooks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["nbstripout>=0.7", "pre-commit>=3.7", "pytest>=8.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.nbstripout]
extra_keys = "metadata.kernelspec metadata.language_info"
